name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm run typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Test iframe integration
        run: pnpm run test:render
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate annotation service URL
        if: github.event_name != 'pull_request'
        env:
          VITE_ANNOTATION_URL: ${{ vars.VITE_ANNOTATION_URL }}
        run: |
          node --input-type=module <<'JS'
          const value = process.env.VITE_ANNOTATION_URL;
          if (!value) {
            console.log('No annotation service configured. The site will show a connection notice until VITE_ANNOTATION_URL is set.');
            process.exit(0);
          }
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.username || url.password || ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) {
            throw new Error('VITE_ANNOTATION_URL must be a public HTTPS URL without credentials.');
          }
          JS
      - name: Build site
        env:
          VITE_ANNOTATION_URL: ${{ vars.VITE_ANNOTATION_URL }}
          VITE_MORNINGSTAR_SIGN_IN_URL: ${{ vars.VITE_MORNINGSTAR_SIGN_IN_URL }}
          VITE_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}', github.event.repository.name) || steps.pages.outputs.base_path }}/
        run: pnpm run build
      - name: Prepare application route fallback
        run: cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
